[pytest]
# Pytest Configuration for AI Explanation Engine Tests
pythonpath = .

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options (verbose, short traceback, strict markers, colored, show all outcomes)
# Coverage is enabled by default for backend runs. The HTML report includes
# file, function, and class views for the collected statement/line and branch data.
addopts = -v --tb=short --strict-markers --color=yes -ra -W ignore::DeprecationWarning --cov=app --cov-branch --cov-report=html --cov-report=term-missing

# Markers for test categorization
markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests with real database
    slow: Tests that take significant time
    llm: Tests that require OpenAI API key
    
# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Asyncio (for async test support)
# NOTE: `asyncio_mode` requires the `pytest-asyncio` plugin.
asyncio_default_fixture_loop_scope = function
