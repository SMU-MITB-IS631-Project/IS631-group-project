[pytest]
# Repository-level pytest config to avoid collecting legacy/manual scripts.
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Keep default collection focused on maintained automated backend tests.
testpaths =
    backend/tests

addopts = -v --tb=short --strict-markers --color=yes -ra -W ignore::DeprecationWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests with real database
    slow: Tests that take significant time
    llm: Tests that require OpenAI API key
